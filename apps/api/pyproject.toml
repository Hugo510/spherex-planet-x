[project]
name = "spherex-api"
version = "0.0.0"
description = "Backend de datos SPHEREx (se construye durante el hackathon)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "astropy>=6.0", "pyvo>=1.5", "reproject>=0.13", "photutils>=1.12", "sep>=1.2",
  "numpy>=1.26", "httpx>=0.27", "tenacity>=8.3", "orjson>=3.10", "Pillow>=10",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
