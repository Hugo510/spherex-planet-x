[project]
name = "spherex-api"
version = "0.1.0"
description = "Backend de datos del comparador honesto de SPHEREx (Clean Architecture: domain / usecases / adapters / api)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "astropy>=6.0", "pyvo>=1.5", "reproject>=0.13", "photutils>=1.12", "scipy>=1.13",
  "numpy>=1.26", "httpx>=0.27", "orjson>=3.10", "Pillow>=10",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openapi-spec-validator>=0.7"]
modal = ["modal>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E741"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requiere IRSA/S3 en vivo (se salta en CI con SPHEREX_OFFLINE=1)"]
