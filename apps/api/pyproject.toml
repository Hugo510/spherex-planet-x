[project]
name = "spherex-api"
version = "0.1.0"
description = "Data backend of The Honest SPHEREx Comparator (Clean Architecture: domain / usecases / adapters / api)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "The Honest SPHEREx Comparator team" }]
keywords = ["spherex", "nasa", "irsa", "astronomy", "fastapi", "space-apps"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Hugo510/spherex-planet-x"
Documentation = "https://github.com/Hugo510/spherex-planet-x/tree/main/docs"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "astropy>=6.0", "pyvo>=1.5", "reproject>=0.13", "photutils>=1.12", "scipy>=1.13",
  "numpy>=1.26", "httpx>=0.27", "orjson>=3.10", "Pillow>=10",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openapi-spec-validator>=0.7"]
modal = ["modal>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requiere IRSA/S3 en vivo (se salta en CI con SPHEREX_OFFLINE=1)"]
