name: precompute-weekly
on:
  schedule:
    - cron: "17 6 * * 2"   # martes 06:17 UTC, tras la ingesta semanal de IRSA
  workflow_dispatch:
jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv pip install --system -r poc/requirements.txt
      - run: echo "TODO (14 nov): precomputar coadds por visita de los 5 objetos y subir a R2"
